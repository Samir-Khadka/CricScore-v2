name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  user:
    name: User app lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: user/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
