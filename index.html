  <body>
    <script>
      // Apply the saved (or system) theme before first paint to avoid FOUC.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.body.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
